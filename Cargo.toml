[package]
name = "upm"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "upm"
path = "src/main.rs"

[[bin]]
name = "upm-installer"
path = "src/bin/installer.rs"

[[bin]]
name = "upm-uninstaller"
path = "src/bin/uninstaller.rs"

[[bin]]
name = "upm-setup"
path = "src/bin/setup.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "http2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.0"
blake3 = "1.5"
rayon = "1.10"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1.0"
libdeflater = "1.22"
windows-sys = { version = "0.59", features = [
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Console",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader"
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
